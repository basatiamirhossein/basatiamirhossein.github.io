<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>DataDev</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=fa/">
  <link rel="canonical" href="fa/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    /* Send visitors to their own language when we have it; Persian otherwise. */
    (function () {
      var supported = { fa: 'fa', en: 'en', ar: 'ar', ckb: 'ckb', ku: 'ckb', tr: 'tr' };
      var langs = navigator.languages || [navigator.language || ''];
      for (var i = 0; i < langs.length; i++) {
        var code = supported[String(langs[i]).toLowerCase().split('-')[0]];
        if (code) { location.replace(code + '/'); return; }
      }
      location.replace('fa/');
    })();
  </script>
</head>
<body>
  <a href="fa/">دیتادِو</a>
</body>
</html>
